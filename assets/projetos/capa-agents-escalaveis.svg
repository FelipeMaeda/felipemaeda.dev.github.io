<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Capa Plataforma de Agents Escaláveis">
  <rect width="1600" height="700" fill="#f5f3ef"/>
  <!-- Grid of agents -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="220" y="260" width="90" height="90"/>
    <rect x="330" y="260" width="90" height="90"/>
    <rect x="440" y="260" width="90" height="90"/>
    <rect x="550" y="260" width="90" height="90"/>
    <rect x="220" y="370" width="90" height="90"/>
    <rect x="330" y="370" width="90" height="90"/>
    <rect x="440" y="370" width="90" height="90"/>
    <rect x="550" y="370" width="90" height="90"/>
  </g>
  <g fill="#b85c3f">
    <rect x="240" y="280" width="50" height="50"/>
    <rect x="350" y="280" width="50" height="50"/>
    <rect x="460" y="280" width="50" height="50"/>
    <rect x="570" y="280" width="50" height="50"/>
    <rect x="240" y="390" width="50" height="50"/>
    <rect x="350" y="390" width="50" height="50"/>
  </g>
  <!-- Arrow to pipeline -->
  <g fill="none" stroke="#1d1d1b" stroke-width="3">
    <path d="M660 405 L820 405"/>
    <polygon points="820,395 850,405 820,415" fill="#1d1d1b" stroke="none"/>
  </g>
  <!-- Pipeline stages -->
  <g>
    <rect x="880" y="360" width="130" height="90" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <rect x="1030" y="360" width="130" height="90" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <rect x="1180" y="360" width="130" height="90" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <rect x="1330" y="360" width="130" height="90" fill="#b85c3f"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="17" fill="#1d1d1b">
    <text x="945" y="410">Build</text>
    <text x="1095" y="410">Test</text>
    <text x="1245" y="410">Package</text>
    <text x="1395" y="410" fill="#f5f3ef">Deploy</text>
  </g>
  <text x="80" y="130" font-family="Georgia,serif" font-size="52" fill="#1d1d1b">Agents escaláveis em EKS</text>
  <text x="80" y="170" font-family="Arial,sans-serif" font-size="20" fill="#666761">Self-hosted agents do Azure DevOps escalando por demanda com Karpenter e KEDA.</text>
</svg>
