<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Arquitetura Fundação Cloud AWS">
  <rect width="1200" height="720" fill="#f5f3ef"/>
  <!-- Root org -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="500" y="70" width="200" height="70" rx="4"/>
  </g>
  <text x="600" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1d1d1b">AWS Organization</text>
  <!-- OU boxes -->
  <g fill="none" stroke="#1d1d1b" stroke-width="1.5">
    <path d="M600 140 L600 190 L200 190 L200 230"/>
    <path d="M600 190 L600 230"/>
    <path d="M600 190 L1000 190 L1000 230"/>
  </g>
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="90" y="230" width="220" height="70" rx="4"/>
    <rect x="490" y="230" width="220" height="70" rx="4"/>
    <rect x="890" y="230" width="220" height="70" rx="4"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#1d1d1b" font-size="16">
    <text x="200" y="270">OU Security</text>
    <text x="600" y="270">OU Foundations</text>
    <text x="1000" y="270">OU Workloads</text>
  </g>
  <!-- Accounts under each OU -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="90" y="330" width="220" height="55" rx="4"/>
    <rect x="90" y="395" width="220" height="55" rx="4"/>
    <rect x="490" y="330" width="220" height="55" rx="4"/>
    <rect x="490" y="395" width="220" height="55" rx="4"/>
    <rect x="890" y="330" width="220" height="55" rx="4"/>
    <rect x="890" y="395" width="220" height="55" rx="4"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#1d1d1b" font-size="14">
    <text x="200" y="362">Log Archive</text>
    <text x="200" y="427">Audit</text>
    <text x="600" y="362">Network Hub</text>
    <text x="600" y="427">Shared Services</text>
    <text x="1000" y="362">Prod</text>
    <text x="1000" y="427">Dev</text>
  </g>
  <!-- Connectivity layer -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="90" y="510" width="1020" height="120" rx="6"/>
  </g>
  <text x="115" y="540" font-family="Arial,sans-serif" font-size="14" fill="#b85c3f" letter-spacing="2">CONECTIVIDADE HÍBRIDA</text>
  <text x="115" y="575" font-family="Arial,sans-serif" font-size="20" fill="#1d1d1b">Transit Gateway · Direct Connect · Equinix Fabric</text>
  <text x="115" y="605" font-family="Arial,sans-serif" font-size="14" fill="#666761">Rota unificada entre regiões AWS, on-prem e outras clouds.</text>
  <text x="600" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#666761">FIGURA 1 · ESTRUTURA DE ORG E CONECTIVIDADE (SUBSTITUA POR SUA VERSÃO)</text>
</svg>
