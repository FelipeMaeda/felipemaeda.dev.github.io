<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Capa Fundação Cloud GCP">
  <defs>
    <linearGradient id="gcp-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8ded3"/>
      <stop offset="1" stop-color="#dedbd4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#gcp-bg)"/>
  <g fill="none" stroke="#1d1d1b" stroke-width="2" opacity=".2">
    <path d="M0 560h1600M0 460h1600M0 360h1600M0 260h1600M0 160h1600"/>
  </g>
  <!-- Hub central -->
  <circle cx="800" cy="380" r="70" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
  <text x="800" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#1d1d1b">Hub</text>
  <!-- Spokes -->
  <g fill="none" stroke="#b85c3f" stroke-width="3">
    <path d="M800 380 L440 220"/>
    <path d="M800 380 L440 540"/>
    <path d="M800 380 L1160 220"/>
    <path d="M800 380 L1160 540"/>
  </g>
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="360" y="180" width="160" height="80"/>
    <rect x="360" y="500" width="160" height="80"/>
    <rect x="1080" y="180" width="160" height="80"/>
    <rect x="1080" y="500" width="160" height="80"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#1d1d1b" font-size="18">
    <text x="440" y="225">Shared VPC</text>
    <text x="440" y="545">Segurança</text>
    <text x="1160" y="225">Landing Zone</text>
    <text x="1160" y="545">Workloads</text>
  </g>
  <!-- Google-style dots -->
  <g>
    <circle cx="80" cy="80" r="12" fill="#4285F4"/>
    <circle cx="112" cy="80" r="12" fill="#EA4335"/>
    <circle cx="144" cy="80" r="12" fill="#FBBC05"/>
    <circle cx="176" cy="80" r="12" fill="#34A853"/>
  </g>
  <text x="80" y="150" font-family="Georgia,serif" font-size="46" fill="#1d1d1b">Fundação Cloud GCP</text>
  <text x="80" y="185" font-family="Arial,sans-serif" font-size="20" fill="#666761">Governança, guardrails e conectividade privada em escala corporativa.</text>
</svg>
