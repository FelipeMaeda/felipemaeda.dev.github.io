<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Capa Primeiro Cluster EKS">
  <rect width="1600" height="700" fill="#dedbd4"/>
  <!-- Kubernetes-ish heptagon -->
  <g transform="translate(1200 350)">
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="none" stroke="#1d1d1b" stroke-width="3"/>
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="#b85c3f" opacity=".15"/>
    <circle r="60" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#1d1d1b">EKS</text>
    <g fill="#1d1d1b">
      <circle cx="0" cy="-140" r="10"/>
      <circle cx="120" cy="-70" r="10"/>
      <circle cx="120" cy="70" r="10"/>
      <circle cx="0" cy="140" r="10"/>
      <circle cx="-120" cy="70" r="10"/>
      <circle cx="-120" cy="-70" r="10"/>
    </g>
    <g fill="none" stroke="#1d1d1b" stroke-width="1.5">
      <path d="M0 -140 L45 -30"/>
      <path d="M120 -70 L55 -20"/>
      <path d="M120 70 L55 20"/>
      <path d="M0 140 L0 55"/>
      <path d="M-120 70 L-55 20"/>
      <path d="M-120 -70 L-55 -20"/>
    </g>
  </g>
  <text x="80" y="130" font-family="Georgia,serif" font-size="52" fill="#1d1d1b">Primeiro Cluster EKS</text>
  <text x="80" y="170" font-family="Arial,sans-serif" font-size="20" fill="#666761">Infraestrutura como código, deploy via Ansible e observabilidade integrada.</text>
  <g font-family="Arial,sans-serif" fill="#1d1d1b">
    <text x="80" y="320" font-size="18">01 · Terraform provisiona VPC, subnets e o cluster.</text>
    <text x="80" y="360" font-size="18">02 · Ansible executa bootstrap e configuração dos add-ons.</text>
    <text x="80" y="400" font-size="18">03 · Datadog e Dynatrace observam control plane e workloads.</text>
    <text x="80" y="440" font-size="18">04 · CI/CD promove workloads para os ambientes.</text>
  </g>
</svg>
