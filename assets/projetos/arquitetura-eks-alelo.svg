<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Arquitetura Primeiro Cluster EKS">
  <rect width="1200" height="720" fill="#f5f3ef"/>
  <!-- Terraform / IaC layer -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="80" y="90" width="1040" height="90" rx="6"/>
  </g>
  <text x="105" y="125" font-family="Arial,sans-serif" font-size="14" fill="#b85c3f" letter-spacing="2">IAC</text>
  <text x="105" y="158" font-family="Arial,sans-serif" font-size="20" fill="#1d1d1b">Terraform provisiona VPC, IAM, EKS, node groups e add-ons.</text>
  <!-- EKS box -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="80" y="220" width="700" height="340" rx="6"/>
  </g>
  <text x="105" y="255" font-family="Arial,sans-serif" font-size="14" fill="#b85c3f" letter-spacing="2">EKS</text>
  <text x="105" y="290" font-family="Arial,sans-serif" font-size="20" fill="#1d1d1b">Control plane gerenciado + node groups</text>
  <!-- Pods -->
  <g fill="#b85c3f">
    <rect x="120" y="330" width="80" height="80"/>
    <rect x="210" y="330" width="80" height="80"/>
    <rect x="300" y="330" width="80" height="80"/>
    <rect x="120" y="420" width="80" height="80"/>
    <rect x="210" y="420" width="80" height="80"/>
    <rect x="300" y="420" width="80" height="80"/>
  </g>
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="420" y="330" width="330" height="80" rx="4"/>
    <rect x="420" y="420" width="330" height="80" rx="4"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#1d1d1b" font-size="16">
    <text x="435" y="378">Ingress · Service Mesh</text>
    <text x="435" y="468">Add-ons (DNS, cert-manager, ExternalDNS)</text>
  </g>
  <!-- Observability -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="810" y="220" width="310" height="340" rx="6"/>
  </g>
  <text x="835" y="255" font-family="Arial,sans-serif" font-size="14" fill="#b85c3f" letter-spacing="2">OBSERVABILIDADE</text>
  <text x="835" y="290" font-family="Arial,sans-serif" font-size="20" fill="#1d1d1b">Datadog · Dynatrace</text>
  <g fill="#dedbd4" stroke="#1d1d1b">
    <rect x="835" y="320" width="260" height="60" rx="4"/>
    <rect x="835" y="390" width="260" height="60" rx="4"/>
    <rect x="835" y="460" width="260" height="60" rx="4"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#1d1d1b" font-size="14">
    <text x="850" y="357">Métricas de nós e pods</text>
    <text x="850" y="427">APM das aplicações</text>
    <text x="850" y="497">Logs e alertas</text>
  </g>
  <!-- Ansible layer -->
  <g fill="#fff" stroke="#1d1d1b" stroke-width="2">
    <rect x="80" y="590" width="1040" height="80" rx="6"/>
  </g>
  <text x="105" y="625" font-family="Arial,sans-serif" font-size="14" fill="#b85c3f" letter-spacing="2">DEPLOY</text>
  <text x="105" y="655" font-family="Arial,sans-serif" font-size="20" fill="#1d1d1b">Ansible aplica configurações e promove workloads pelo pipeline.</text>
</svg>
